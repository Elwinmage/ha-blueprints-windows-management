# ═══════════════════════════════════════════════════════════════════════════════
# CARTE MUSHROOM — Surveillance fenêtres par pièce + contrôle global
# ═══════════════════════════════════════════════════════════════════════════════
#
# Prérequis HACS :
#   - lovelace-mushroom
#   - auto-entities
#   - card-mod
#
# Convention de nommage utilisée :
#   input_boolean.etat_fenetre_<piece>   ex. input_boolean.etat_fenetre_salon
#   sensor.aerer_<piece>                 ex. sensor.aerer_salon
#
#   La dérivation du sensor delta se fait en remplaçant
#   "etat_fenetre_" par "aerer_" dans l'entity_id.
#
# Entités déclarées :
#   input_boolean.etat_fenetre_salon
#   input_boolean.etat_fenetre_bureau
#   input_boolean.etat_fenetre_chambre_d_amis
#   input_boolean.etat_fenetre_salle_de_sport
#   input_boolean.etat_fenetres_global
# ═══════════════════════════════════════════════════════════════════════════════

type: vertical-stack
cards:

  # ── CHIP GLOBAL ─────────────────────────────────────────────────────────────
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: input_boolean.etat_fenetres_global
        icon: >
          {% set fenetres = states.input_boolean
            | selectattr('entity_id', 'search', 'etat_fenetre_')
            | rejectattr('entity_id', 'search', 'etat_fenetres_')
            | list %}
          {% if fenetres | selectattr('state', 'eq', 'on') | list | count == 0 %}
            mdi:window-closed-variant
          {% else %}
            mdi:window-open
          {% endif %}
        icon_color: >
          {% set fenetres = states.input_boolean
            | selectattr('entity_id', 'search', 'etat_fenetre_')
            | rejectattr('entity_id', 'search', 'etat_fenetres_')
            | list %}
          {% set nb = fenetres | selectattr('state', 'eq', 'on') | list | count %}
          {% set total = fenetres | count %}
          {% if nb == 0 %}grey
          {% elif nb == total %}green
          {% else %}orange{% endif %}
        content: >
          {% set fenetres = states.input_boolean
            | selectattr('entity_id', 'search', 'etat_fenetre_')
            | rejectattr('entity_id', 'search', 'etat_fenetres_')
            | list %}
          {% set nb = fenetres | selectattr('state', 'eq', 'on') | list | count %}
          {% set total = fenetres | count %}
          {% if nb == 0 %}Tout fermé
          {% elif nb == total %}Tout ouvert
          {% else %}{{ nb }}/{{ total }} ouvertes{% endif %}
        tap_action:
          action: call-service
          service: input_boolean.toggle
          service_data:
            entity_id: input_boolean.etat_fenetres_global
        hold_action:
          action: more-info

  # ── CHIPS INDIVIDUELS via auto-entities ─────────────────────────────────────
  - type: custom:auto-entities
    card:
      type: custom:mushroom-chips-card
    card_param: chips
    filter:
      include:
        - domain: input_boolean
          entity_id: "*etat_fenetre_*"
          options:
            type: template
            icon: >
              {% set e = config.entity %}
              {{ 'mdi:window-open' if is_state(e, 'on')
                 else 'mdi:window-closed-variant' }}
            icon_color: >
              {% set e = config.entity %}
              {% set delta_id = 'sensor.aerer_' ~ e.split('etat_fenetre_')[1] %}
              {% if is_state(e, 'off') %}grey
              {% else %}
                {% set d = states(delta_id) | float(0) %}
                {% if d > 0.3 %}blue{% elif d < 0 %}red{% else %}grey{% endif %}
              {% endif %}
            content: >
              {% set e = config.entity %}
              {% set delta_id = 'sensor.aerer_' ~ e.split('etat_fenetre_')[1] %}
              {% set label = state_attr(e, 'friendly_name')
                             | replace('Etat fenetre ', '')
                             | replace('Etat fenêtre ', '')
                             | replace('Etat Fenetre ', '')
                             | replace('Etat Fenêtre ', '')
                             | title %}
              {{ label }}
              {%- if is_state(e, 'on') %}
                {% set d = states(delta_id) | float(0) %}
                · {{ '+' if d > 0 else '' }}{{ d | round(1) }}°C
              {%- endif %}
            tap_action:
              action: call-service
              service: input_boolean.toggle
              service_data:
                entity_id: "{{ config.entity }}"
            hold_action:
              action: more-info
            card_mod:
              style: >
                :host {
                  {% if is_state(config.entity, 'off') %}
                    opacity: 0.45;
                  {% endif %}
                }
      exclude:
        - entity_id: "*etat_fenetres_*"
        - entity_id: "*etat_clim_*"
    sort:
      method: friendly_name
