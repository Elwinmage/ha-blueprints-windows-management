# Requires HACS: auto-entities, mushroom, card-mod.
# Nothing is declared here: rooms, contacts and delta sensors are all derived
# from the HA area registry. Pairing a new Shelly and assigning it to an area
# is enough for its chip to appear.
type: custom:auto-entities
card_param: chips
card:
  type: custom:mushroom-chips-card
  card_mod:
    style: |
      ha-card {
        margin: -4px -4px 4px -4px !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        border-bottom: 1px solid var(--divider-color) !important;
      }
      ha-card .chips {
        flex-wrap: wrap !important;
        gap: 4px !important;
        padding: 8px 12px !important;
      }
filter:
  template: |
    {#- Optional label overrides, keyed by area_id. Areas not listed here use
        their registry name as-is. Only needed to shorten long room names. -#}
    {%- set alias = {} -%}
    {#- e.g. {'chambre_parentale': 'Ch. Parentale', 'chambre_de_roxane': 'Roxane'} -#}

    {#- Every Shelly BLU window contact, whatever its area.
        The double filter keeps out the other binary entities of the same
        device (tilt/rotation…). -#}
    {%- set contacts = states.binary_sensor
          | selectattr('entity_id', 'search', 'shelly_blu_door_window')
          | selectattr('entity_id', 'search', 'fenetre')
          | map(attribute='entity_id') | list -%}

    {#- ── SUMMARY CHIP ──────────────────────────────────────────────────────
        Counts every contact found, including any not assigned to an area
        (which would otherwise be invisible). Unavailable ones are excluded
        from both counts, so a Shelly off the BLE mesh is never read as closed.
    -#}
    {%- set dispo = expand(contacts)
          | rejectattr('state', 'in', ['unavailable', 'unknown']) | list -%}
    {%- set nb = dispo | selectattr('state', 'eq', 'on') | list | count -%}
    {%- set total = dispo | count -%}
    {%- set ns = namespace(pieces=[], chips=[{
      'type': 'template',
      'icon': 'mdi:window-open-variant' if nb > 0 else 'mdi:window-closed-variant',
      'icon_color': 'grey' if nb == 0 else ('green' if nb == total else 'orange'),
      'content': 'N/C' if total == 0 else (
                 'Tout fermé' if nb == 0 else (
                 'Tout ouvert' if nb == total else nb ~ '/' ~ total ~ ' ouvertes')),
      'tap_action': {'action': 'none'},
      'hold_action': {'action': 'none'}
    }]) -%}

    {#- ── ONE ROW PER AREA ────────────────────────────────────────────────
        area_id() falls back to the device's area, so entities left on
        "inherit from device" are resolved too. Rows are sorted by label to
        keep a stable chip order across restarts.
    -#}
    {%- for a in contacts | map('area_id') | reject('none') | unique | list -%}
      {%- set ac = area_entities(a)
            | select('search', 'shelly_blu_door_window')
            | select('search', 'fenetre') | list -%}
      {%- set aerer = area_entities(a)
            | select('search', 'sensor\.aerer_') | list | first -%}
      {%- set ns.pieces = ns.pieces
            + [(alias.get(a, area_name(a)), aerer, ac)] -%}
    {%- endfor -%}

    {%- for label, aerer, ac in ns.pieces | sort -%}
      {%- set presents = expand(ac) | list -%}
      {%- set ouvertes = presents | selectattr('state', 'eq', 'on') | list | count -%}
      {%- set d = states(aerer) | float(none) if aerer else none -%}
      {#- Partial state is only shown for multi-window rooms -#}
      {%- set frac = (' ' ~ ouvertes ~ '/' ~ presents | count)
                     if (ouvertes > 0 and ouvertes < presents | count) else '' -%}
      {%- set delta = '' if d is none else
            ' · ' ~ ('+' if d > 0 else '') ~ (d | round(1)) ~ '°C' -%}
      {%- set couleur = 'grey' if d is none else
            ('blue' if d > 0.3 else ('red' if d < 0 else 'grey')) -%}
      {%- set ns.chips = ns.chips + [{
        'type': 'template',
        'entity': ac | first,
        'icon': 'mdi:window-open-variant' if ouvertes > 0 else 'mdi:window-closed-variant',
        'icon_color': couleur,
        'content': label ~ frac ~ delta,
        'tap_action': {'action': 'more-info'},
        'card_mod': {'style': ':host { opacity: 0.55; }'} if ouvertes == 0 else {}
      }] -%}
    {%- endfor -%}

    {{ ns.chips }}
