type: custom:mushroom-chips-card
card_mod:
  style: |
    ha-card {
      margin: -4px -4px 4px -4px !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      border-bottom: 1px solid var(--divider-color) !important;
    }
    ha-card .chips {
      flex-wrap: wrap !important;
      gap: 4px !important;
      padding: 8px 12px !important;
    }
chips:
  # Global chip: every Shelly BLU window contact is picked up automatically.
  # The double filter (device name + "fenetre") keeps out the other binary
  # entities exposed by the same device (tilt/rotation, etc.).
  # No `entity`: this chip is a pure summary computed from the contacts
  # themselves, it no longer mirrors any helper. Hence no tap action either.
  - type: template
    icon: >
      {% set fenetres = states.binary_sensor
           | selectattr('entity_id', 'search', 'shelly_blu_door_window')
           | selectattr('entity_id', 'search', 'fenetre')
           | rejectattr('state', 'in', ['unavailable', 'unknown'])
           | list %}
      {{ 'mdi:window-open-variant'
         if fenetres | selectattr('state', 'eq', 'on') | list | count > 0
         else 'mdi:window-closed-variant' }}
    icon_color: >
      {% set fenetres = states.binary_sensor
           | selectattr('entity_id', 'search', 'shelly_blu_door_window')
           | selectattr('entity_id', 'search', 'fenetre')
           | rejectattr('state', 'in', ['unavailable', 'unknown'])
           | list %}
      {% set nb = fenetres | selectattr('state', 'eq', 'on') | list | count %}
      {% if nb == 0 %}grey
      {% elif nb == fenetres | count %}green
      {% else %}orange{% endif %}
    content: >
      {% set fenetres = states.binary_sensor
           | selectattr('entity_id', 'search', 'shelly_blu_door_window')
           | selectattr('entity_id', 'search', 'fenetre')
           | rejectattr('state', 'in', ['unavailable', 'unknown'])
           | list %}
      {% set nb = fenetres | selectattr('state', 'eq', 'on') | list | count %}
      {% set total = fenetres | count %}
      {% if total == 0 %}N/C
      {% elif nb == 0 %}Tout fermé
      {% elif nb == total %}Tout ouvert
      {% else %}{{ nb }}/{{ total }} ouvertes{% endif %}
    tap_action:
      action: none
    hold_action:
      action: none

  - type: template
    entity: binary_sensor.shelly_blu_door_window_7374_fenetre
    icon: |
      {{ 'mdi:window-open-variant'
         if is_state('binary_sensor.shelly_blu_door_window_7374_fenetre', 'on')
         else 'mdi:window-closed-variant' }}
    icon_color: >
      {% set d = states('sensor.aerer_salon') | float(none) %} {% if d is none
      %}grey {% elif d > 0.3 %}blue{% elif d < 0 %}red{% else %}grey{% endif %}
    content: >
      {%- set d = states('sensor.aerer_salon') | float(none) %} Salon{%- if d is
      not none %} · {{ '+' if d > 0 else '' }}{{ d | round(1) }}°C{% endif %}
    tap_action:
      action: more-info
    card_mod:
      style: >
        :host { {% if
        is_state('binary_sensor.shelly_blu_door_window_7374_fenetre', 'off')
        %}opacity: 0.55;{% endif %} }

  - type: template
    entity: binary_sensor.chambre_parentale_shelly_blu_door_window_fenetre
    icon: |
      {{ 'mdi:window-open-variant'
         if is_state('binary_sensor.chambre_parentale_shelly_blu_door_window_fenetre', 'on')
         else 'mdi:window-closed-variant' }}
    icon_color: >
      {% set d = states('sensor.aerer_chambre_parentale') | float(none) %} {% if
      d is none %}grey {% elif d > 0.3 %}blue{% elif d < 0 %}red{% else %}grey{%
      endif %}
    content: >
      {%- set d = states('sensor.aerer_chambre_parentale') | float(none) %} Ch.
      Parentale{%- if d is not none %} · {{ '+' if d > 0 else '' }}{{ d |
      round(1) }}°C{% endif %}
    tap_action:
      action: more-info
    card_mod:
      style: >
        :host { {% if
        is_state('binary_sensor.chambre_parentale_shelly_blu_door_window_fenetre',
        'off') %}opacity: 0.55;{% endif %} }

  # Roxane: two Shelly contacts for one room.
  # TODO: replace the XXXX entity below with the second Shelly's real entity_id.
  - type: template
    entity: binary_sensor.shelly_blu_door_window_0507_fenetre
    icon: >
      {% set roxane = ['binary_sensor.shelly_blu_door_window_0507_fenetre',
                       'binary_sensor.shelly_blu_door_window_XXXX_fenetre'] %}
      {% set nb = expand(roxane) | selectattr('state', 'eq', 'on') | list | count %}
      {{ 'mdi:window-open-variant' if nb > 0 else 'mdi:window-closed-variant' }}
    icon_color: >
      {% set d = states('sensor.aerer_chambre_roxane') | float(none) %} {% if d
      is none %}grey {% elif d > 0.3 %}blue{% elif d < 0 %}red{% else %}grey{%
      endif %}
    content: >
      {%- set roxane = ['binary_sensor.shelly_blu_door_window_0507_fenetre',
                        'binary_sensor.shelly_blu_door_window_XXXX_fenetre'] -%}
      {%- set nb = expand(roxane) | selectattr('state', 'eq', 'on') | list | count -%}
      {%- set total = expand(roxane) | list | count -%}
      {%- set d = states('sensor.aerer_chambre_roxane') | float(none) -%}
      Roxane{%- if nb > 0 and nb < total %} {{ nb }}/{{ total }}{% endif %}
      {%- if d is not none %} · {{ '+' if d > 0 else '' }}{{ d | round(1) }}°C{% endif %}
    tap_action:
      action: more-info
    card_mod:
      style: >
        {% set roxane = ['binary_sensor.shelly_blu_door_window_0507_fenetre',
                         'binary_sensor.shelly_blu_door_window_XXXX_fenetre'] %}
        {% set nb = expand(roxane) | selectattr('state', 'eq', 'on') | list | count %}
        :host { {% if nb == 0 %}opacity: 0.55;{% endif %} }

