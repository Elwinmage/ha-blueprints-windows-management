# ═══════════════════════════════════════════════════════
# CARTE MUSHROOM — Surveillance fenêtres par pièce
# + bouton global ouvrir/fermer tout
# ═══════════════════════════════════════════════════════
#
# Prérequis HACS : lovelace-mushroom
#
# Chip global (premier chip) :
#   - Toutes fermées  → icône mdi:window-closed-variant, gris
#   - Partiellement   → icône mdi:window-open, orange
#   - Toutes ouvertes → icône mdi:window-open, vert
#   - Tap             → toggle input_boolean.fenetres_global
#
# Chips individuels :
#   delta > seuil → bleu  (utile d'aérer)
#   delta < 0     → rouge (plus frais dedans, fermer)
#   neutre        → gris
#   fermée        → chip atténué
#   Tap           → toggle l'input_boolean de la pièce
#   Hold          → more-info
# ═══════════════════════════════════════════════════════

type: custom:mushroom-chips-card
chips:

  # ── BOUTON GLOBAL ─────────────────────────────────────────────────────────
  - type: template
    entity: input_boolean.fenetres_global
    icon: >
      {% set fenetres = [
        'input_boolean.fenetre_salon',
        'input_boolean.fenetre_chambre_parentale',
        'input_boolean.fenetre_bureau',
        'input_boolean.fenetre_chambre_amis',
        'input_boolean.fenetre_salle_de_sport'
      ] %}
      {% set nb_ouvertes = fenetres | select('is_state', 'on') | list | count %}
      {% if nb_ouvertes == 0 %}
        mdi:window-closed-variant
      {% else %}
        mdi:window-open
      {% endif %}
    icon_color: >
      {% set fenetres = [
        'input_boolean.fenetre_salon',
        'input_boolean.fenetre_chambre_parentale',
        'input_boolean.fenetre_bureau',
        'input_boolean.fenetre_chambre_amis',
        'input_boolean.fenetre_salle_de_sport'
      ] %}
      {% set nb_ouvertes = fenetres | select('is_state', 'on') | list | count %}
      {% set total = fenetres | count %}
      {% if nb_ouvertes == 0 %}
        grey
      {% elif nb_ouvertes == total %}
        green
      {% else %}
        orange
      {% endif %}
    content: >
      {% set fenetres = [
        'input_boolean.fenetre_salon',
        'input_boolean.fenetre_chambre_parentale',
        'input_boolean.fenetre_bureau',
        'input_boolean.fenetre_chambre_amis',
        'input_boolean.fenetre_salle_de_sport'
      ] %}
      {% set nb_ouvertes = fenetres | select('is_state', 'on') | list | count %}
      {% set total = fenetres | count %}
      {% if nb_ouvertes == 0 %}
        Tout fermé
      {% elif nb_ouvertes == total %}
        Tout ouvert
      {% else %}
        {{ nb_ouvertes }}/{{ total }} ouvertes
      {% endif %}
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    chip_style: >
      border: 1px solid var(--divider-color);

  # ── SÉPARATEUR ────────────────────────────────────────────────────────────
  - type: spacer

  # ── SALON ─────────────────────────────────────────────────────────────────
  - type: template
    entity: input_boolean.fenetre_salon
    icon: >
      {{ 'mdi:window-open' if is_state('input_boolean.fenetre_salon', 'on')
         else 'mdi:window-closed-variant' }}
    icon_color: >
      {% if is_state('input_boolean.fenetre_salon', 'off') %}
        grey
      {% else %}
        {% set delta = states('sensor.aerer_salon') | float(0) %}
        {% if delta > 0.3 %}blue{% elif delta < 0 %}red{% else %}grey{% endif %}
      {% endif %}
    content: >
      Salon
      {%- if is_state('input_boolean.fenetre_salon', 'on') %}
        · {{ states('sensor.aerer_salon') }}°
      {%- endif %}
    style: >
      {% if is_state('input_boolean.fenetre_salon', 'off') %}
        opacity: 0.45;
      {% endif %}
    tap_action:
      action: toggle
    hold_action:
      action: more-info

