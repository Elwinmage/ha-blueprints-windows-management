# Version: 1.2.0
blueprint:
  name: "Fenêtres — contrôle global (v1.2.0)"
  description: >
    Blueprint orchestrateur : un input_boolean global pilote l'ensemble des
    fenêtres déclarées. Toggle global = ouvre toutes / ferme toutes.
    Synchro inverse : toutes fermées individuellement → global passe à OFF.
    Ouvrir une fenêtre individuelle ne déclenche PAS le global (évite la boucle).
  domain: automation
  author: Elwin
  homeassistant:
    min_version: "2024.6.0"

  input:

    fenetre_globale:
      name: input_boolean — contrôle global
      description: "Créer : input_boolean.etat_fenetres_global"
      selector:
        entity:
          filter:
            - domain: input_boolean

    fenetres:
      name: Fenêtres à piloter
      description: >
        Liste de tous les input_boolean fenêtres individuelles.
      selector:
        entity:
          filter:
            - domain: input_boolean
          multiple: true

variables:
  v_global:   !input fenetre_globale
  v_fenetres: !input fenetres

triggers:

  # Global ON → ouvre toutes les fenêtres
  - trigger: state
    id: global_on
    entity_id: !input fenetre_globale
    to: "on"

  # Global OFF → ferme toutes les fenêtres
  - trigger: state
    id: global_off
    entity_id: !input fenetre_globale
    to: "off"

  # Fenêtre individuelle changée → synchro global OFF uniquement
  - trigger: state
    id: individuelle_changed
    entity_id: !input fenetres

conditions: []

actions:
  - choose:

      # Global ON → ouvre tout
      - conditions:
          - condition: trigger
            id: global_on
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input fenetres

      # Global OFF → ferme tout
      - conditions:
          - condition: trigger
            id: global_off
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input fenetres

      # Individuelle changée : si TOUTES fermées → global OFF
      # On ne met PAS le global à ON quand une fenêtre s'ouvre
      # pour éviter la boucle global_on → ouvre tout.
      - conditions:
          - condition: trigger
            id: individuelle_changed
          - condition: template
            value_template: >
              {{ v_fenetres | select('is_state', 'on') | list | count == 0 }}
          - condition: state
            entity_id: !input fenetre_globale
            state: "on"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input fenetre_globale

mode: single
max_exceeded: silent
