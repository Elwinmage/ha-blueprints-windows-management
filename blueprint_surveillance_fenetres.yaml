blueprint:
  name: "Surveillance fenêtre — aération par pièce"
  description: >
    Gère une fenêtre par pièce : calcule le delta intérieur/extérieur, alerte
    quand il n'est plus utile de laisser la fenêtre ouverte, et optionnellement
    coupe/rallume la climatisation selon l'état de la fenêtre.
    Les entités (capteur intérieur, tendance, fenêtre, clim) sont filtrées
    sur la pièce sélectionnée.
  domain: automation
  author: Elwin
  homeassistant:
    min_version: "2024.6.0"

  input:

    # ── 1. PIÈCE ────────────────────────────────────────────────────────────
    piece:
      name: Pièce
      description: >
        La pièce / zone Home Assistant à surveiller.
        Les entités ci-dessous seront filtrées sur cette zone.
      selector:
        area:

    # ── 2. CAPTEURS TEMPÉRATURE ─────────────────────────────────────────────
    sensor_interieur:
      name: Capteur température intérieure
      description: Capteur de température dans la pièce sélectionnée.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
          area: !input piece

    sensor_exterieur:
      name: Capteur température extérieure
      description: >
        Capteur de température extérieure (non attaché à une pièce).
        Partagé entre toutes les instances du blueprint.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    # ── 3. TENDANCE (optionnel) ──────────────────────────────────────────────
    utiliser_tendance:
      name: Utiliser le capteur de tendance ?
      description: >
        Si activé, le blueprint surveille aussi le binary_sensor de tendance
        pour affiner l'alerte (alerte seulement si tendance montante).
      default: false
      selector:
        boolean:

    sensor_tendance:
      name: Capteur de tendance de température (optionnel)
      description: >
        binary_sensor indiquant si la température de la pièce est en hausse.
        État "on" = température montante. Filtré sur la pièce sélectionnée.
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
          area: !input piece

    # ── 4. FENÊTRE ──────────────────────────────────────────────────────────
    fenetre_boolean:
      name: État de la fenêtre (input_boolean)
      description: >
        input_boolean représentant l'état ouvert/fermé de la fenêtre.
        Filtré sur la pièce sélectionnée.
      selector:
        entity:
          filter:
            - domain: input_boolean
          area: !input piece

    # ── 5. SEUIL & DURÉE ────────────────────────────────────────────────────
    seuil_fermeture:
      name: Seuil de fermeture (°C)
      description: >
        Alerte envoyée quand le delta (intérieur − extérieur) passe sous ce seuil
        pendant la durée définie. Défaut : 0.3 °C
      default: 0.3
      selector:
        number:
          min: 0.0
          max: 3.0
          step: 0.1
          unit_of_measurement: "°C"
          mode: slider

    duree_avant_alerte:
      name: Durée avant alerte (minutes)
      description: >
        Le delta doit rester sous le seuil pendant cette durée avant d'envoyer
        la notification.
      default: 2
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: min
          mode: slider

    # ── 6. NOTIFICATION ─────────────────────────────────────────────────────
    notification_target:
      name: Cible de notification
      description: >
        Entité ou groupe notify à utiliser pour les alertes.
      selector:
        target:
          entity:
            domain: notify

    # ── 7. CLIMATISATION (optionnel) ────────────────────────────────────────
    gestion_clim:
      name: Gérer la climatisation ?
      description: >
        Si activé, coupe la clim quand la fenêtre est ouverte et la rallume
        (si elle tournait) quand la fenêtre est refermée.
      default: false
      selector:
        boolean:

    clim_entity:
      name: Entité climatisation (optionnel)
      description: >
        Entité climate à couper/rallumer selon l'état de la fenêtre.
        Filtrée sur la pièce sélectionnée.
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
          area: !input piece

    memoire_clim:
      name: Mémoire état clim (input_boolean, optionnel)
      description: >
        input_boolean dédié pour mémoriser si la clim tournait avant l'ouverture.
        Créer un input_boolean par pièce (ex. input_boolean.clim_salon_etait_allumee).
        Filtré sur la pièce sélectionnée.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean
          area: !input piece

# ─────────────────────────────────────────────────────────────────────────────
# VARIABLES
# ─────────────────────────────────────────────────────────────────────────────
variables:
  v_int:            !input sensor_interieur
  v_ext:            !input sensor_exterieur
  v_fenetre:        !input fenetre_boolean
  v_seuil:          !input seuil_fermeture
  v_tendance_on:    !input utiliser_tendance
  v_tendance:       !input sensor_tendance
  v_gestion_clim:   !input gestion_clim
  v_clim:           !input clim_entity
  v_memoire:        !input memoire_clim
  # Computed delta — used in notification message
  v_delta: >
    {% set t_int = states(v_int) | float(none) %}
    {% set t_ext = states(v_ext) | float(none) %}
    {% if t_int is not none and t_ext is not none %}
      {{ (t_int - t_ext) | round(1) }}
    {% else %}
      none
    {% endif %}
  # Friendly area name for notifications
  v_piece_label: >
    {{ area_name(v_fenetre) | default('la pièce') }}

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGERS
# ─────────────────────────────────────────────────────────────────────────────
triggers:
  # Periodic check: re-evaluate delta every minute when window is open
  - trigger: time_pattern
    id: check_delta
    minutes: "/1"

  # Window opened
  - trigger: state
    id: fenetre_ouverte
    entity_id: !input fenetre_boolean
    to: "on"

  # Window closed
  - trigger: state
    id: fenetre_fermee
    entity_id: !input fenetre_boolean
    to: "off"

# ─────────────────────────────────────────────────────────────────────────────
# CONDITIONS
# ─────────────────────────────────────────────────────────────────────────────
conditions: []

# ─────────────────────────────────────────────────────────────────────────────
# ACTIONS
# ─────────────────────────────────────────────────────────────────────────────
actions:
  - choose:

      # ── Periodic check: delta too low → alert ───────────────────────────────
      - conditions:
          - condition: trigger
            id: check_delta
          # Window must be open
          - condition: state
            entity_id: !input fenetre_boolean
            state: "on"
          # Delta must be below threshold
          - condition: template
            value_template: >
              {% set t_int = states(v_int) | float(none) %}
              {% set t_ext = states(v_ext) | float(none) %}
              {{ t_int is not none and t_ext is not none and (t_int - t_ext) < v_seuil | float(0.3) }}
          # If tendance enabled: only alert if temperature is rising (door should be closed)
          - condition: template
            value_template: >
              {% if v_tendance_on and v_tendance != '' %}
                {{ is_state(v_tendance, 'on') or is_state(v_tendance, 'unavailable') }}
              {% else %}
                true
              {% endif %}
        sequence:
          - action: notify.send_message
            target: !input notification_target
            data:
              title: "🪟 Ferme la fenêtre — {{ v_piece_label }}"
              message: >
                Plus utile de laisser ouvert : delta {{ v_delta }}°C
                (intérieur {{ states(v_int) | round(1) }}°C /
                extérieur {{ states(v_ext) | round(1) }}°C)

      # ── Window opened → cut clim if running ─────────────────────────────────
      - conditions:
          - condition: trigger
            id: fenetre_ouverte
          - condition: template
            value_template: "{{ v_gestion_clim and v_clim != '' and v_memoire != '' }}"
        sequence:
          - choose:
              # Clim is running → memorize then cut
              - conditions:
                  - condition: template
                    value_template: "{{ not is_state(v_clim, 'off') }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ v_memoire }}"
                  - action: climate.turn_off
                    target:
                      entity_id: "{{ v_clim }}"
            # Clim already off → reset memory
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ v_memoire }}"

      # ── Window closed → restore clim if it was running ───────────────────────
      - conditions:
          - condition: trigger
            id: fenetre_fermee
          - condition: template
            value_template: "{{ v_gestion_clim and v_clim != '' and v_memoire != '' }}"
          - condition: template
            value_template: "{{ is_state(v_memoire, 'on') }}"
        sequence:
          - action: climate.turn_on
            target:
              entity_id: "{{ v_clim }}"
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ v_memoire }}"

mode: parallel
max: 10
