# Version: 2.0.0
blueprint:
  name: "Surveillance fenêtre — aération par pièce (v2.0.0)"
  description: >
    Gère une pièce et ses fenêtres : calcule le delta intérieur/extérieur,
    alerte quand il n'est plus utile de laisser ouvert, et optionnellement
    coupe/rallume la climatisation.
    Une pièce peut déclarer plusieurs contacts de fenêtre (ex. chambre à
    deux fenêtres) : la pièce est considérée « ouverte » dès qu'un contact
    est ouvert, et « fermée » seulement quand ils le sont tous.
    La coupure de la clim et l'alerte d'aération sont temporisées par un
    délai commun (au moins une fenêtre ouverte depuis plus de X) ; la remise
    en marche de la clim à la fermeture reste immédiate.
    Une seule alerte et une seule mémoire clim par pièce, quel que soit le
    nombre de fenêtres.
    Instancier une fois par pièce.

    BREAKING v1.3.0 -> v2.0.0 : l'entrée « fenêtres » accepte désormais
    plusieurs entités. Les automatisations existantes (une seule entité)
    restent compatibles, la valeur est normalisée en liste.
  domain: automation
  author: Elwin
  homeassistant:
    min_version: "2024.6.0"
  input:
    # ── 1. PIÈCE ────────────────────────────────────────────────────────────
    piece:
      name: Pièce / Zone
      description: >
        Zone Home Assistant correspondant à la pièce surveillée.
        Utilisée pour nommer la pièce dans les notifications.
      selector:
        area:
    # ── 2. CAPTEURS TEMPÉRATURE ──────────────────────────────────────────────
    sensor_interieur:
      name: Capteur température intérieure
      description: >
        Capteur de température de la pièce.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    sensor_exterieur:
      name: Capteur température extérieure
      description: >
        Capteur de température extérieure, partagé entre toutes les instances.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    # ── 3. TENDANCE ──────────────────────────────────────────────────────────
    utiliser_tendance:
      name: Utiliser le capteur de tendance ?
      description: >
        Si activé, l'alerte ne se déclenche que si la température de la pièce
        n'est PAS en hausse. Si la pièce se réchauffe malgré la fenêtre
        ouverte, l'alerte part quand même.
      default: false
      selector:
        boolean:
    sensor_tendance:
      name: Capteur de tendance (binary_sensor)
      description: >
        binary_sensor indiquant la tendance de température de la pièce.
        État "on" = température montante, "off" = descendante ou stable.
        L'alerte est envoyée uniquement si la tendance est "off" (descendante
        ou stable) — si la pièce se refroidit déjà toute seule, inutile d'alerter.
        Si la tendance est "on" (montante) et le delta est faible, l'alerte
        part quand même car la pièce va continuer à se réchauffer.
        Si vous n'en avez pas encore : Paramètres → Appareils et services →
        Ajouter une intégration → "Capteur de gradient" (Derivative).
        Sélectionnez le capteur de température de la pièce, réglez
        "Nombre minimum d'échantillons" à 5 et "Taux minimum de changement"
        à 0.0006.
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
    # ── 4. FENÊTRE ───────────────────────────────────────────────────────────
    # NOTE: the input key stays `fenetre_boolean` for backward compatibility
    # with automations created before v2.0.0, where it held a single entity_id.
    fenetre_boolean:
      name: Contacts de fenêtre de la pièce
      description: >
        Contacts ouvert/fermé de la pièce : binary_sensor (Shelly BLU…) ou
        input_boolean. Sélectionnez-en autant que la pièce compte de fenêtres.
        La pièce est ouverte dès qu'un contact est ouvert ; la clim n'est
        rallumée et l'alerte réarmée que lorsque tous sont fermés.
      selector:
        entity:
          filter:
            - domain: input_boolean
            - domain: binary_sensor
          multiple: true
    # ── 5. SEUIL & FRÉQUENCE ─────────────────────────────────────────────────
    seuil_fermeture:
      name: Seuil de fermeture (°C)
      description: >
        Alerte envoyée quand le delta (intérieur − extérieur) passe sous ce seuil.
        Défaut : 0.3 °C
      default: 0.3
      selector:
        number:
          min: 0.0
          max: 3.0
          step: 0.1
          unit_of_measurement: "°C"
          mode: slider
    # ── 6. NOTIFICATION ──────────────────────────────────────────────────────
    notification_target:
      name: Service de notification
      description: >
        Service notify complet à appeler pour les alertes.
        Saisir le nom complet incluant "notify." — exemples :
          notify.group_de_notification_les_cheris
          notify.group_de_notification_admin
          notify.mobile_app_mon_telephone
        Les groupes définis dans configuration.yaml (notify: platform: group)
        sont recommandés pour éviter de reconfigurer si vous changez d'appareil.
      default: "notify.group_de_notification_les_cheris"
      selector:
        text:
    # ── 7. FLAG NOTIFICATION ─────────────────────────────────────────────────
    notif_deja_envoyee:
      name: Flag alerte déjà envoyée (input_boolean)
      description: >
        input_boolean dédié pour mémoriser si une alerte a déjà été envoyée 
        pour cette pièce. Crée un par pièce (ex. input_boolean.alerte_salon_envoyee).
        Cela évite de recevoir la notification à chaque cycle de 2 minutes,
        elle ne sera envoyée qu'une seule fois tant que la fenêtre reste ouverte
        et le delta reste bas. Le flag est réinitialisé quand la fenêtre se ferme.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean
    # ── 8. CLIMATISATION ─────────────────────────────────────────────────────
    gestion_clim:
      name: Gérer la climatisation ?
      description: >
        Si activé, coupe la clim quand la fenêtre est ouverte et la rallume
        (si elle tournait) quand la fenêtre est refermée.
      default: false
      selector:
        boolean:
    clim_entity:
      name: Entité climatisation (optionnel)
      description: >
        Entité climate à couper/rallumer selon l'état de la fenêtre.
        Obligatoire si "Gérer la climatisation" est activé.
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    # NOTE: the input key stays `delai_coupure_clim` for backward compatibility
    # with automations created under v1.1.0, even though the delay now gates
    # both the clim cut-off and the airing alert.
    delai_coupure_clim:
      name: Délai de prise en compte de l'ouverture
      description: >
        Durée pendant laquelle la fenêtre doit rester ouverte en continu
        avant que l'automatisation ne réagisse. Évite de réagir à une
        ouverture brève (aller/retour sur la terrasse, secouer un tapis…).
        S'applique à deux choses :
          - la coupure de la clim ;
          - l'alerte « ferme la fenêtre » : aucune notification n'est envoyée
            tant que la fenêtre n'est pas ouverte depuis au moins ce délai.
        Si la fenêtre est refermée avant la fin du délai, rien ne se passe.
        La remise en marche de la clim à la fermeture reste immédiate,
        quel que soit ce délai.
        Mettre 0 pour réagir dès l'ouverture (comportement v1.0).
        Défaut : 1 minute.
      default:
        hours: 0
        minutes: 1
        seconds: 0
      selector:
        duration:
    memoire_clim:
      name: Mémoire état clim (input_boolean, optionnel)
      description: >
        input_boolean dédié pour mémoriser si la clim tournait avant l'ouverture.
        Créer un input_boolean par pièce (ex. input_boolean.clim_salon_etait_allumee).
        Obligatoire si "Gérer la climatisation" est activé.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean
# ─────────────────────────────────────────────────────────────────────────────
# VARIABLES
# ─────────────────────────────────────────────────────────────────────────────
variables:
  v_area:             !input piece
  v_int:              !input sensor_interieur
  v_ext:              !input sensor_exterieur
  v_seuil:            !input seuil_fermeture
  v_tendance_on:      !input utiliser_tendance
  v_gestion_clim:     !input gestion_clim
  v_clim:             !input clim_entity
  v_memoire:          !input memoire_clim
  # Accepts both shapes: a bare entity_id (pre-v2.0.0 automations) and a list.
  v_fenetre_raw:      !input fenetre_boolean
  v_fenetres: >
    {{ [v_fenetre_raw] if v_fenetre_raw is string else v_fenetre_raw }}
  # Room-level state: open as soon as ONE contact is open.
  v_nb_ouvertes: >
    {{ expand(v_fenetres) | selectattr('state', 'eq', 'on') | list | count }}
  # Delay expressed in seconds, for the "open for at least X" template below.
  # The duration selector yields a mapping; older configs may hold "HH:MM:SS".
  v_delai_raw:        !input delai_coupure_clim
  v_delai_s: >
    {% if v_delai_raw is string %}
      {{ (as_timedelta(v_delai_raw) or timedelta(0)).total_seconds() | int }}
    {% else %}
      {{ ((v_delai_raw.days    | default(0)) * 86400
        + (v_delai_raw.hours   | default(0)) * 3600
        + (v_delai_raw.minutes | default(0)) * 60
        + (v_delai_raw.seconds | default(0))) | int }}
    {% endif %}
  # Names of the currently open windows, listed in the alert when the room
  # has more than one.
  v_ouvertes_label: >
    {{ expand(v_fenetres) | selectattr('state', 'eq', 'on')
       | map(attribute='name') | join(', ') }}
  v_tendance:         !input sensor_tendance
  v_notif_flag:       !input notif_deja_envoyee
  notification_target: !input notification_target
  # Computed delta interior - exterior
  v_delta: >
    {% set t_int = states(v_int) | float(none) %}
    {% set t_ext = states(v_ext) | float(none) %}
    {% if t_int is none or t_ext is none %}
      none
    {% else %}
      {{ (t_int - t_ext) | round(1) }}
    {% endif %}
  # Friendly area name for notifications
  v_piece_label: >
    {{ area_name(v_area) | default('la pièce') }}
# ─────────────────────────────────────────────────────────────────────────────
# TRIGGERS
# ─────────────────────────────────────────────────────────────────────────────
triggers:
  # Periodic delta check — triggers every 2 minutes
  # Note: time_pattern requires "/N" string syntax for "every N minutes".
  # !input cannot produce this format, so the interval is fixed at 2 minutes.
  - trigger: time_pattern
    id: check_delta
    minutes: "/2"
  # Window opened — fires only after the window stayed open for the
  # configured duration. If the window is closed before the delay elapses,
  # the trigger never fires and the clim is left untouched.
  # `for` is restored across HA restarts (evaluated from last_changed).
  # `not_from` ignores unavailable -> on transitions: a Shelly BLU dropping
  # off the BLE mesh and coming back would otherwise re-fire this branch on
  # an already-open window and wipe the clim memory flag.
  - trigger: state
    id: fenetre_ouverte
    entity_id: !input fenetre_boolean
    to: "on"
    not_from:
      - "unavailable"
      - "unknown"
    for: !input delai_coupure_clim
  # Window closed
  # Same guard: unavailable -> off must not restart the clim while the
  # window is in fact still open.
  - trigger: state
    id: fenetre_fermee
    entity_id: !input fenetre_boolean
    to: "off"
    not_from:
      - "unavailable"
      - "unknown"
# ─────────────────────────────────────────────────────────────────────────────
# CONDITIONS
# ─────────────────────────────────────────────────────────────────────────────
conditions: []
# ─────────────────────────────────────────────────────────────────────────────
# ACTIONS
# ─────────────────────────────────────────────────────────────────────────────
actions:
  - choose:
      # ── Periodic check: delta too low → alert (once) ──────────────────────
      - conditions:
          - condition: trigger
            id: check_delta
          # At least ONE window open for at least the configured delay.
          # A state condition with several entities is an AND (all of them
          # open), which is not what we want here, hence the template.
          # last_changed is the per-entity equivalent of a native `for`.
          - condition: template
            value_template: >
              {{ expand(v_fenetres)
                 | selectattr('state', 'eq', 'on')
                 | selectattr('last_changed', 'lt',
                              now() - timedelta(seconds=v_delai_s | int))
                 | list | count > 0 }}
          # Delta must be computable and below threshold
          - condition: template
            value_template: >
              {{ v_delta != 'none' and v_delta is not none
                 and v_delta | float < v_seuil | float }}
          # If tendance enabled: alert when temperature is NOT rising
          # (if already cooling down, no need to alert — room is self-cooling)
          - condition: template
            value_template: >
              {% if v_tendance_on and v_tendance != '' %}
                {{ is_state(v_tendance, 'off') or is_state(v_tendance, 'unavailable') }}
              {% else %}
                true
              {% endif %}
          # SOLUTION 1: notification flag must be OFF (not yet sent)
          - condition: template
            value_template: "{{ v_notif_flag == '' or is_state(v_notif_flag, 'off') }}"
        sequence:
          - action: "{{ notification_target }}"
            data:
              title: "🪟 Ferme la fenêtre — {{ v_piece_label }}"
              message: >
                Plus utile de laisser ouvert : delta {{ v_delta }}°C
                (intérieur {{ states(v_int) | float(0) | round(1) }}°C / extérieur {{ states(v_ext) | float(0) | round(1) }}°C)
                {%- if v_fenetres | count > 1 %}
                — ouverte(s) : {{ v_ouvertes_label }}
                {%- endif %}
          # Mark notification as sent. Guarded: the input is optional and
          # calling a service with an empty entity_id aborts the sequence.
          - if:
              - condition: template
                value_template: "{{ v_notif_flag != '' }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ v_notif_flag }}"
      # ── Window open for X → cut clim if running ─────────────────────────────
      - conditions:
          - condition: trigger
            id: fenetre_ouverte
          - condition: template
            value_template: "{{ v_gestion_clim and v_clim != '' and v_memoire != '' }}"
        sequence:
          - choose:
              # Clim is running → memorize then cut
              - conditions:
                  - condition: template
                    value_template: "{{ not is_state(v_clim, 'off') }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ v_memoire }}"
                  - action: climate.turn_off
                    target:
                      entity_id: "{{ v_clim }}"
              # Clim already off AND this is the first window of the room to
              # open → nothing was running, clear the memory.
              # On a second window opening, the clim is off because WE cut it:
              # resetting here would strand the memory flag and the clim would
              # never come back on at closing time.
              - conditions:
                  - condition: template
                    value_template: "{{ v_nb_ouvertes | int <= 1 }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ v_memoire }}"
      # ── Window closed → restore clim immediately if it was running ──────────
      - conditions:
          - condition: trigger
            id: fenetre_fermee
          # Every window of the room must be closed: closing one of two
          # would otherwise restart the clim with the other still open.
          - condition: template
            value_template: "{{ v_nb_ouvertes | int == 0 }}"
          - condition: template
            value_template: "{{ v_gestion_clim and v_clim != '' and v_memoire != '' }}"
          - condition: template
            value_template: "{{ is_state(v_memoire, 'on') }}"
        sequence:
          - action: climate.turn_on
            target:
              entity_id: "{{ v_clim }}"
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ v_memoire }}"
      # ── Window closed → reset notification flag ────────────────────────────
      - conditions:
          - condition: trigger
            id: fenetre_fermee
          # Same rule: the alert is re-armed only once the room is fully closed.
          - condition: template
            value_template: "{{ v_nb_ouvertes | int == 0 }}"
          - condition: template
            value_template: "{{ v_notif_flag != '' }}"
        sequence:
          # Reset notification flag for next time window opens
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ v_notif_flag }}"
# queued rather than parallel: two contacts of the same room can change
# within the same second, and the branches read/write a shared memory flag.
mode: queued
max: 10
