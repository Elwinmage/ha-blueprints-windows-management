blueprint:
  name: "Surveillance fenêtre — aération par pièce"
  description: >
    Gère une fenêtre par pièce : calcule le delta intérieur/extérieur,
    alerte quand il n'est plus utile de laisser la fenêtre ouverte, et
    optionnellement coupe/rallume la climatisation.
    Tous les capteurs sont sélectionnés explicitement.
    Instancier une fois par pièce.
  domain: automation
  author: Elwin
  homeassistant:
    min_version: "2024.6.0"

  input:

    # ── 1. PIÈCE ────────────────────────────────────────────────────────────
    piece:
      name: Pièce / Zone
      description: >
        Zone Home Assistant correspondant à la pièce surveillée.
        Utilisée pour nommer la pièce dans les notifications.
      selector:
        area:

    # ── 2. CAPTEURS TEMPÉRATURE ──────────────────────────────────────────────
    sensor_interieur:
      name: Capteur température intérieure
      description: >
        Capteur de température de la pièce.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    sensor_exterieur:
      name: Capteur température extérieure
      description: >
        Capteur de température extérieure, partagé entre toutes les instances.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    # ── 3. TENDANCE ──────────────────────────────────────────────────────────
    utiliser_tendance:
      name: Utiliser le capteur de tendance ?
      description: >
        Si activé, l'alerte ne se déclenche que si la température de la pièce
        est en hausse, évitant les faux positifs quand la pièce se refroidit
        naturellement.
      default: false
      selector:
        boolean:

    sensor_tendance:
      name: Capteur de tendance (binary_sensor)
      description: >
        binary_sensor indiquant la tendance de température de la pièce.
        État "on" = température montante, "off" = descendante ou stable.

        L'alerte est envoyée uniquement si la tendance est "off" (descendante
        ou stable) — si la pièce se refroidit déjà toute seule, inutile d'alerter.
        Si la tendance est "on" (montante) et le delta est faible, l'alerte
        part quand même car la pièce va continuer à se réchauffer.

        Si vous n'en avez pas encore : Paramètres → Appareils et services →
        Ajouter une intégration → "Capteur de gradient" (Derivative).
        Sélectionnez le capteur de température de la pièce, réglez
        "Nombre minimum d'échantillons" à 5 et "Taux minimum de changement"
        à 0.0006.
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor

    # ── 4. FENÊTRE ───────────────────────────────────────────────────────────
    fenetre_boolean:
      name: État de la fenêtre (input_boolean)
      description: >
        input_boolean représentant l'état ouvert/fermé de la fenêtre.
        Doit contenir "fenetre" dans l'entity_id et être assigné à la zone.
        Nécessaire pour les triggers — ne peut pas être auto-détecté.
      selector:
        entity:
          filter:
            - domain: input_boolean

    # ── 5. SEUIL & FRÉQUENCE ─────────────────────────────────────────────────
    seuil_fermeture:
      name: Seuil de fermeture (°C)
      description: >
        Alerte envoyée quand le delta (intérieur − extérieur) passe sous ce seuil.
        Défaut : 0.3 °C
      default: 0.3
      selector:
        number:
          min: 0.0
          max: 3.0
          step: 0.1
          unit_of_measurement: "°C"
          mode: slider

    duree_avant_alerte:
      name: Fréquence de vérification (minutes)
      description: >
        Le delta est réévalué toutes les N minutes quand la fenêtre est ouverte.
        Défaut : 2 min
      default: 2
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: min
          mode: slider

    # ── 5. NOTIFICATION ──────────────────────────────────────────────────────
    notification_target:
      name: Service de notification
      description: >
        Service notify complet à appeler pour les alertes.
        Saisir le nom complet incluant "notify." — exemples :

          notify.group_de_notification_les_cheris
          notify.group_de_notification_admin
          notify.mobile_app_mon_telephone

        Les groupes définis dans configuration.yaml (notify: platform: group)
        sont recommandés pour éviter de reconfigurer si vous changez d'appareil.
      default: "notify.group_de_notification_les_cheris"
      selector:
        text:

    # ── 6. CLIMATISATION ─────────────────────────────────────────────────────
    gestion_clim:
      name: Gérer la climatisation ?
      description: >
        Si activé, coupe la clim quand la fenêtre est ouverte et la rallume
        (si elle tournait) quand la fenêtre est refermée.
      default: false
      selector:
        boolean:

    clim_entity:
      name: Entité climatisation (optionnel)
      description: >
        Entité climate à couper/rallumer selon l'état de la fenêtre.
        Obligatoire si "Gérer la climatisation" est activé.
      default: ""
      selector:
        entity:
          filter:
            - domain: climate

    memoire_clim:
      name: Mémoire état clim (input_boolean, optionnel)
      description: >
        input_boolean dédié pour mémoriser si la clim tournait avant l'ouverture.
        Créer un input_boolean par pièce (ex. input_boolean.clim_salon_etait_allumee).
        Obligatoire si "Gérer la climatisation" est activé.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean

# ─────────────────────────────────────────────────────────────────────────────
# VARIABLES — auto-detect entities from area via area_entities()
# ─────────────────────────────────────────────────────────────────────────────
variables:
  v_area:             !input piece
  v_int:              !input sensor_interieur
  v_ext:              !input sensor_exterieur
  v_seuil:            !input seuil_fermeture
  v_tendance_on:      !input utiliser_tendance
  v_gestion_clim:     !input gestion_clim
  v_clim:             !input clim_entity
  v_memoire:          !input memoire_clim
  v_fenetre:          !input fenetre_boolean
  v_tendance:         !input sensor_tendance
  notification_target: !input notification_target

  # Computed delta interior - exterior
  v_delta: >
    {% set t_int = states(v_int) | float(none) %}
    {% set t_ext = states(v_ext) | float(none) %}
    {% if t_int is none or t_ext is none %}
      none
    {% else %}
      {{ (t_int - t_ext) | round(1) }}
    {% endif %}

  # Friendly area name for notifications
  v_piece_label: >
    {{ area_name(v_area) | default('la pièce') }}

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGERS
# ─────────────────────────────────────────────────────────────────────────────
triggers:

  # Periodic delta check
  - trigger: time_pattern
    id: check_delta
    minutes: !input duree_avant_alerte

  # Window opened — classic state trigger on the explicit input_boolean
  - trigger: state
    id: fenetre_ouverte
    entity_id: !input fenetre_boolean
    to: "on"

  # Window closed
  - trigger: state
    id: fenetre_fermee
    entity_id: !input fenetre_boolean
    to: "off"

# ─────────────────────────────────────────────────────────────────────────────
# CONDITIONS
# ─────────────────────────────────────────────────────────────────────────────
conditions: []

# ─────────────────────────────────────────────────────────────────────────────
# ACTIONS
# ─────────────────────────────────────────────────────────────────────────────
actions:
  - choose:

      # ── Periodic check: delta too low → alert ───────────────────────────────
      - conditions:
          - condition: trigger
            id: check_delta
          # Window must be open
          - condition: template
            value_template: "{{ v_fenetre != '' and is_state(v_fenetre, 'on') }}"
          # Delta must be computable and below threshold
          - condition: template
            value_template: >
              {{ v_delta != 'none' and v_delta is not none
                 and v_delta | float < v_seuil | float }}
          # If tendance enabled: alert when temperature is NOT rising
          # (if already cooling down, no need to alert — room is self-cooling)
          - condition: template
            value_template: >
              {% if v_tendance_on and v_tendance != '' %}
                {{ is_state(v_tendance, 'off') or is_state(v_tendance, 'unavailable') }}
              {% else %}
                true
              {% endif %}
        sequence:
          - action: "{{ notification_target }}"
            data:
              title: "🪟 Ferme la fenêtre — {{ v_piece_label }}"
              message: >
                Plus utile de laisser ouvert : delta {{ v_delta }}°C
                (intérieur {{ states(v_int) | round(1) }}°C / extérieur {{ states(v_ext) | round(1) }}°C)

      # ── Window opened → cut clim if running ─────────────────────────────────
      - conditions:
          - condition: trigger
            id: fenetre_ouverte
          - condition: template
            value_template: "{{ v_gestion_clim and v_clim != '' and v_memoire != '' }}"
        sequence:
          - choose:
              # Clim is running → memorize then cut
              - conditions:
                  - condition: template
                    value_template: "{{ not is_state(v_clim, 'off') }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ v_memoire }}"
                  - action: climate.turn_off
                    target:
                      entity_id: "{{ v_clim }}"
            # Clim already off → reset memory
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ v_memoire }}"

      # ── Window closed → restore clim if it was running ───────────────────────
      - conditions:
          - condition: trigger
            id: fenetre_fermee
          - condition: template
            value_template: "{{ v_gestion_clim and v_clim != '' and v_memoire != '' }}"
          - condition: template
            value_template: "{{ is_state(v_memoire, 'on') }}"
        sequence:
          - action: climate.turn_on
            target:
              entity_id: "{{ v_clim }}"
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ v_memoire }}"

mode: parallel
max: 10
