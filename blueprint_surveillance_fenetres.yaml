blueprint:
  name: "Surveillance fenêtre — aération par pièce"
  description: >
    Gère une fenêtre par pièce : détecte automatiquement les entités de la zone
    (capteur température, tendance, fenêtre, clim) via area_entities().
    Alerte quand il n'est plus utile de laisser la fenêtre ouverte, et
    optionnellement coupe/rallume la climatisation.
    Instancier une fois par pièce.
  domain: automation
  author: Elwin
  homeassistant:
    min_version: "2024.6.0"

  input:

    # ── 1. PIÈCE ────────────────────────────────────────────────────────────
    piece:
      name: Pièce / Zone
      description: >
        Zone Home Assistant à surveiller. Toutes les entités (capteur
        température intérieure, tendance, fenêtre, clim) sont détectées
        automatiquement parmi les entités assignées à cette zone.
      selector:
        area:

    # ── 2. CAPTEUR EXTÉRIEUR ─────────────────────────────────────────────────
    sensor_exterieur:
      name: Capteur température extérieure
      description: >
        Capteur de température extérieure, non assigné à une zone.
        Partagé entre toutes les instances du blueprint.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    # ── 3. TENDANCE ──────────────────────────────────────────────────────────
    utiliser_tendance:
      name: Utiliser le capteur de tendance ?
      description: >
        Si activé, l'alerte ne se déclenche que si la température de la pièce
        est en hausse (binary_sensor de tendance à "on").
        Le binary_sensor est détecté automatiquement dans la zone
        si son entity_id contient "tendance".
      default: false
      selector:
        boolean:

    # ── 4. FENÊTRE ───────────────────────────────────────────────────────────
    fenetre_boolean:
      name: État de la fenêtre (input_boolean)
      description: >
        input_boolean représentant l'état ouvert/fermé de la fenêtre.
        Doit contenir "fenetre" dans l'entity_id et être assigné à la zone.
        Nécessaire pour les triggers — ne peut pas être auto-détecté.
      selector:
        entity:
          filter:
            - domain: input_boolean

    # ── 5. SEUIL & FRÉQUENCE ─────────────────────────────────────────────────
    seuil_fermeture:
      name: Seuil de fermeture (°C)
      description: >
        Alerte envoyée quand le delta (intérieur − extérieur) passe sous ce seuil.
        Défaut : 0.3 °C
      default: 0.3
      selector:
        number:
          min: 0.0
          max: 3.0
          step: 0.1
          unit_of_measurement: "°C"
          mode: slider

    duree_avant_alerte:
      name: Fréquence de vérification (minutes)
      description: >
        Le delta est réévalué toutes les N minutes quand la fenêtre est ouverte.
        Défaut : 2 min
      default: 2
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: min
          mode: slider

    # ── 5. NOTIFICATION ──────────────────────────────────────────────────────
    notification_target:
      name: Cible de notification
      description: Entité ou groupe notify à utiliser pour les alertes.
      selector:
        target:
          entity:
            domain: notify

    # ── 6. CLIMATISATION ─────────────────────────────────────────────────────
    gestion_clim:
      name: Gérer la climatisation ?
      description: >
        Si activé, coupe la clim quand la fenêtre est ouverte et la rallume
        (si elle tournait) quand la fenêtre est refermée.
        L'entité climate est détectée automatiquement dans la zone.
      default: false
      selector:
        boolean:

    memoire_clim:
      name: Mémoire état clim (input_boolean, optionnel)
      description: >
        input_boolean dédié pour mémoriser si la clim tournait avant l'ouverture.
        Créer un input_boolean par pièce (ex. input_boolean.clim_salon_etait_allumee)
        et l'assigner à la zone. Il sera détecté automatiquement si son
        entity_id contient "memoire" ou "etait".
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean

# ─────────────────────────────────────────────────────────────────────────────
# VARIABLES — auto-detect entities from area via area_entities()
# ─────────────────────────────────────────────────────────────────────────────
variables:
  v_area:         !input piece
  v_ext:          !input sensor_exterieur
  v_seuil:        !input seuil_fermeture
  v_tendance_on:  !input utiliser_tendance
  v_gestion_clim: !input gestion_clim
  v_memoire:      !input memoire_clim
  # Window boolean is also an explicit input (needed for triggers)
  v_fenetre:      !input fenetre_boolean

  # Interior temperature sensor: first sensor with device_class=temperature in the area.
  # If multiple sensors exist, their values are averaged.
  v_int_sensors: >
    {% set ns = namespace(sensors=[]) %}
    {% for e in area_entities(v_area) %}
      {% if e.startswith('sensor.')
         and states[e] is defined
         and is_state_attr(e, 'device_class', 'temperature') %}
        {% set ns.sensors = ns.sensors + [e] %}
      {% endif %}
    {% endfor %}
    {{ ns.sensors }}

  # Averaged interior temperature (handles multiple sensors in same room)
  v_int_temp: >
    {% set sensors = v_int_sensors %}
    {% if sensors | count == 0 %}
      none
    {% else %}
      {{ sensors | map('states') | map('float', none)
         | select('!=', none) | list | average | round(1) }}
    {% endif %}

  # First binary_sensor with "tendance" in entity_id within the area
  v_tendance: >
    {% set ns = namespace(found='') %}
    {% for e in area_entities(v_area) %}
      {% if e.startswith('binary_sensor.') and 'tendance' in e %}
        {% set ns.found = e %}
      {% endif %}
    {% endfor %}
    {{ ns.found }}

  # First climate entity within the area
  v_clim: >
    {% set ns = namespace(found='') %}
    {% for e in area_entities(v_area) %}
      {% if e.startswith('climate.') %}
        {% set ns.found = e %}
      {% endif %}
    {% endfor %}
    {{ ns.found }}

  # Computed delta interior - exterior
  v_delta: >
    {% set t_ext = states(v_ext) | float(none) %}
    {% if v_int_temp == 'none' or v_int_temp is none or t_ext is none %}
      none
    {% else %}
      {{ (v_int_temp | float - t_ext) | round(1) }}
    {% endif %}

  # Friendly area name for notifications
  v_piece_label: >
    {{ area_name(v_area) | default('la pièce') }}

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGERS
# ─────────────────────────────────────────────────────────────────────────────
triggers:

  # Periodic delta check
  - trigger: time_pattern
    id: check_delta
    minutes: !input duree_avant_alerte

  # Window opened — classic state trigger on the explicit input_boolean
  - trigger: state
    id: fenetre_ouverte
    entity_id: !input fenetre_boolean
    to: "on"

  # Window closed
  - trigger: state
    id: fenetre_fermee
    entity_id: !input fenetre_boolean
    to: "off"

# ─────────────────────────────────────────────────────────────────────────────
# CONDITIONS
# ─────────────────────────────────────────────────────────────────────────────
conditions: []

# ─────────────────────────────────────────────────────────────────────────────
# ACTIONS
# ─────────────────────────────────────────────────────────────────────────────
actions:
  - choose:

      # ── Periodic check: delta too low → alert ───────────────────────────────
      - conditions:
          - condition: trigger
            id: check_delta
          # Window must be open
          - condition: template
            value_template: "{{ v_fenetre != '' and is_state(v_fenetre, 'on') }}"
          # Delta must be computable and below threshold
          - condition: template
            value_template: >
              {{ v_delta != 'none' and v_delta is not none
                 and v_delta | float < v_seuil | float }}
          # If tendance enabled: only alert when temperature is rising
          - condition: template
            value_template: >
              {% if v_tendance_on and v_tendance != '' %}
                {{ is_state(v_tendance, 'on') }}
              {% else %}
                true
              {% endif %}
        sequence:
          - action: notify.send_message
            target: !input notification_target
            data:
              title: "🪟 Ferme la fenêtre — {{ v_piece_label }}"
              message: >
                Plus utile de laisser ouvert : delta {{ v_delta }}°C
                (intérieur {{ v_int_temp }}°C / extérieur {{ states(v_ext) | round(1) }}°C)

      # ── Window opened → cut clim if running ─────────────────────────────────
      - conditions:
          - condition: trigger
            id: fenetre_ouverte
          - condition: template
            value_template: "{{ v_gestion_clim and v_clim != '' and v_memoire != '' }}"
        sequence:
          - choose:
              # Clim is running → memorize then cut
              - conditions:
                  - condition: template
                    value_template: "{{ not is_state(v_clim, 'off') }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ v_memoire }}"
                  - action: climate.turn_off
                    target:
                      entity_id: "{{ v_clim }}"
            # Clim already off → reset memory
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ v_memoire }}"

      # ── Window closed → restore clim if it was running ───────────────────────
      - conditions:
          - condition: trigger
            id: fenetre_fermee
          - condition: template
            value_template: "{{ v_gestion_clim and v_clim != '' and v_memoire != '' }}"
          - condition: template
            value_template: "{{ is_state(v_memoire, 'on') }}"
        sequence:
          - action: climate.turn_on
            target:
              entity_id: "{{ v_clim }}"
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ v_memoire }}"

mode: parallel
max: 10
